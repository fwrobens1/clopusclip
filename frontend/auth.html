<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#08090a" />
<title>Sign in — NoetharaClipz</title>
<link rel="icon" type="image/png" href="/static/logo64.png" />
<link rel="stylesheet" href="/static/public.css" />
</head>
<body class="pub">
<main class="pub-auth-shell">
  <div class="pub-auth-panel">
    <section class="pub-auth-card">
      <div class="pub-auth-logo"><img src="/static/logo64.png" alt="NoetharaClipz" /></div>
      <h1 id="authTitle">Welcome to NoetharaClipz.</h1>
      <p class="sub" id="authSub">Your studio is one sign-in away.</p>

      <form id="authForm" autocomplete="on">
        <div class="pub-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="pub-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
        </div>
        <div class="pub-field-row">
          <label><input id="remember" type="checkbox" checked style="accent-color:var(--pv-acid)" /> Remember this device</label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>
        <div class="pub-auth-actions">
          <button class="pub-btn pub-btn-acid" id="submitBtn" type="submit">Login</button>
          <button class="pub-btn pub-btn-ghost" id="switchBtn" type="button">Create an account</button>
        </div>
      </form>

      <div class="pub-auth-msg" id="authMsg" role="status" aria-live="polite"></div>
      <div class="pub-auth-switch">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</div>
    </section>
  </div>
  <div class="pub-auth-foot">NOCTX · Built for clips people actually watch.</div>
</main>
<script src="/static/auth.js"></script>
</body>
</html>
